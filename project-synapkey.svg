<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bgS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0a1a"/>
      <stop offset="100%" style="stop-color:#141028"/>
    </linearGradient>
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c63ff"/>
      <stop offset="100%" style="stop-color:#ff6584"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgS)"/>
  <!-- Grid -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.04">
    <line x1="0" y1="90" x2="800" y2="90"/><line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/><line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/><line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/><line x1="640" y1="0" x2="640" y2="450"/>
  </g>
  <!-- Glow hinter dem Key -->
  <circle cx="400" cy="190" r="120" fill="#6c63ff" opacity="0.10"/>
  <!-- Key-Mark: Schlüsselkopf als Synapse-Knoten -->
  <g>
    <circle cx="400" cy="160" r="42" fill="none" stroke="url(#keyGrad)" stroke-width="10"/>
    <rect x="394" y="200" width="12" height="80" rx="6" fill="url(#keyGrad)"/>
    <rect x="394" y="248" width="34" height="11" rx="5.5" fill="url(#keyGrad)"/>
    <rect x="394" y="268" width="24" height="11" rx="5.5" fill="url(#keyGrad)"/>
    <!-- Synapsen-Verbindungen -->
    <g stroke="#6c63ff" stroke-width="1.5" opacity="0.45">
      <line x1="365" y1="135" x2="290" y2="95"/>
      <line x1="435" y1="135" x2="510" y2="95"/>
      <line x1="442" y1="170" x2="530" y2="195"/>
      <line x1="358" y1="170" x2="270" y2="195"/>
    </g>
    <circle cx="290" cy="95" r="7" fill="#6c63ff" opacity="0.9"/>
    <circle cx="510" cy="95" r="7" fill="#ff6584" opacity="0.9"/>
    <circle cx="530" cy="195" r="7" fill="#ffca28" opacity="0.9"/>
    <circle cx="270" cy="195" r="7" fill="#6c63ff" opacity="0.9"/>
  </g>
  <!-- Wortmarke -->
  <text x="400" y="345" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#f0f0f5" text-anchor="middle" letter-spacing="2">Synapkey</text>
  <text x="400" y="375" font-family="Inter, Arial, sans-serif" font-size="13" fill="#a0a0b0" text-anchor="middle" letter-spacing="4">FIREBASE · FIRESTORE · SECURITY RULES</text>
  <!-- Status-Chip -->
  <rect x="346" y="395" width="108" height="24" rx="12" fill="#6c63ff" opacity="0.14"/>
  <circle cx="362" cy="407" r="4" fill="#ffca28"/>
  <text x="408" y="411" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#cfcaff" text-anchor="middle">IN DEVELOPMENT</text>
</svg>
